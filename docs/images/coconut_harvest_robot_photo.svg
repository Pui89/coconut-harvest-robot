<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff7ff"/>
      <stop offset="100%" stop-color="#d4f7df"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a4ec9a"/>
      <stop offset="100%" stop-color="#5ebc73"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" x2="1">
      <stop offset="0%" stop-color="#8d5a2d"/>
      <stop offset="100%" stop-color="#5a3616"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1">
      <stop offset="0%" stop-color="#41d783"/>
      <stop offset="100%" stop-color="#19814e"/>
    </linearGradient>
    <linearGradient id="coco" x1="0" x2="1">
      <stop offset="0%" stop-color="#f7be59"/>
      <stop offset="100%" stop-color="#c97712"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0" x2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" x2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#sky)"/>
  <rect y="620" width="1600" height="360" fill="url(#grass)"/>

  <!-- Background hills -->
  <path d="M0 670 Q260 560 520 660 T1040 660 T1600 670 L1600 980 L0 980 Z" fill="#7ecf8d" opacity="0.75"/>
  <path d="M0 720 Q300 610 610 720 T1280 720 T1600 720 L1600 980 L0 980 Z" fill="#61b873" opacity="0.82"/>

  <!-- Main coconut tree -->
  <g filter="url(#shadow)">
    <rect x="1040" y="230" width="58" height="310" rx="18" fill="url(#trunk)"/>
    <path d="M1068 180 C980 190, 938 262, 972 316 C915 320, 870 382, 932 432 C888 472, 902 540, 988 540 C1046 610, 1145 575, 1170 500 C1200 475, 1215 388, 1170 340 C1208 315, 1207 255, 1160 220 C1125 190, 1108 172, 1068 180 Z" fill="url(#leaf)"/>
    <path d="M1028 260 C955 300, 948 360, 1008 395 C1082 365, 1108 307, 1028 260 Z" fill="#47d48e" opacity="0.82"/>
    <path d="M1078 270 C1122 290, 1170 322, 1210 350 C1166 368, 1114 335, 1078 270 Z" fill="#45d384" opacity="0.8"/>
    <path d="M1039 420 C1115 450, 1170 490, 1192 545 C1126 565, 1068 535, 1039 420 Z" fill="#1fb36b" opacity="0.8"/>
    <path d="M960 400 C905 440, 900 500, 968 540 C1008 515, 1030 470, 960 400 Z" fill="#65df95" opacity="0.8"/>
  </g>

  <!-- Coconuts -->
  <g>
    <circle cx="1108" cy="330" r="28" fill="url(#coco)"/>
    <circle cx="1170" cy="360" r="30" fill="url(#coco)"/>
    <circle cx="1050" cy="400" r="30" fill="url(#coco)"/>
    <circle cx="1138" cy="455" r="26" fill="url(#coco)"/>
    <circle cx="1185" cy="420" r="23" fill="url(#coco)"/>
  </g>

  <!-- Robot -->
  <g filter="url(#shadow)">
    <!-- chassis -->
    <rect x="180" y="520" width="230" height="90" rx="22" fill="url(#robotBody)"/>
    <rect x="255" y="440" width="100" height="85" rx="16" fill="#dfe7f2"/>
    <rect x="275" y="392" width="62" height="52" rx="10" fill="#cdd6e2"/>
    <rect x="288" y="348" width="36" height="45" fill="#94a3b8"/>

    <!-- wheels -->
    <circle cx="245" cy="615" r="36" fill="#1f2937"/>
    <circle cx="360" cy="615" r="36" fill="#1f2937"/>
    <circle cx="245" cy="615" r="16" fill="#9ca3af"/>
    <circle cx="360" cy="615" r="16" fill="#9ca3af"/>

    <!-- arm -->
    <path d="M 355 450 L 470 405" stroke="url(#arm)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 470 405 L 610 365" stroke="url(#arm)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <rect x="610" y="345" width="110" height="20" rx="10" fill="#cbd5e1"/>
    <rect x="710" y="337" width="24" height="38" rx="8" fill="#fbbf24"/>
    <circle cx="726" cy="338" r="16" fill="#f7c971"/>
    <circle cx="726" cy="338" r="7" fill="#fff7db"/>

    <!-- camera / sensor -->
    <rect x="286" y="360" width="92" height="34" rx="10" fill="#e2e8f0"/>
    <circle cx="332" cy="376" r="14" fill="#60a5fa"/>
    <circle cx="332" cy="376" r="5" fill="#dbeafe"/>
  </g>

  <!-- Example detection rays -->
  <path d="M 760 380 L 980 420" stroke="#60a5fa" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M 760 390 L 970 463" stroke="#60a5fa" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Info cards -->
  <g transform="translate(40 60)">
    <rect width="420" height="140" rx="20" fill="#ffffff" opacity="0.9"/>
    <text x="28" y="54" font-size="28" font-family="Arial" fill="#0f172a">Coconut harvest robot</text>
    <text x="28" y="90" font-size="22" font-family="Arial" fill="#374151">Vision + depth + action planning</text>
    <text x="28" y="118" font-size="22" font-family="Arial" fill="#374151">for high-canopy harvesting</text>
  </g>

  <g transform="translate(1130 120)">
    <rect width="360" height="170" rx="16" fill="#ffffff" opacity="0.9"/>
    <text x="28" y="50" font-size="28" font-family="Arial" fill="#0f172a">Vision system</text>
    <text x="28" y="88" font-size="22" font-family="Arial" fill="#334155">- coconut detection</text>
    <text x="28" y="120" font-size="22" font-family="Arial" fill="#334155">- height estimation</text>
    <text x="28" y="152" font-size="22" font-family="Arial" fill="#334155">- branch localization</text>
  </g>

  <g transform="translate(1130 330)">
    <rect width="380" height="170" rx="16" fill="#ffffff" opacity="0.9"/>
    <text x="28" y="50" font-size="28" font-family="Arial" fill="#0f172a">Spatial planner</text>
    <text x="28" y="88" font-size="22" font-family="Arial" fill="#334155">- target pose generation</text>
    <text x="28" y="120" font-size="22" font-family="Arial" fill="#334155">- reachability analysis</text>
    <text x="28" y="152" font-size="22" font-family="Arial" fill="#334155">- safe harvest angle</text>
  </g>

  <g transform="translate(1130 540)">
    <rect width="350" height="170" rx="16" fill="#ffffff" opacity="0.9"/>
    <text x="28" y="50" font-size="28" font-family="Arial" fill="#0f172a">Action model</text>
    <text x="28" y="88" font-size="22" font-family="Arial" fill="#334155">- approach</text>
    <text x="28" y="120" font-size="22" font-family="Arial" fill="#334155">- grip / cut</text>
    <text x="28" y="152" font-size="22" font-family="Arial" fill="#334155">- drop / remove</text>
  </g>
</svg>
