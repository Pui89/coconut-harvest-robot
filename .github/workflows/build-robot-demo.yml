name: Build 3D Coconut Robot Demo

on:
  workflow_dispatch:
  push:
    paths:
      - "sim/**"
      - ".github/workflows/build-robot-demo.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib trimesh imageio
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python sim/coconut_harvester_demo.py
      - uses: actions/upload-artifact@v7
        with:
          name: coconut-harvester-3d-demo
          path: |
            sim/assets/coconut_harvester_3d.glb
            sim/assets/coconut_harvester_demo.mp4
