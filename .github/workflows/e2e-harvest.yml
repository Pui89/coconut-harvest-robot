name: End-to-end harvest reference
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit-and-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run end-to-end tests
        run: python -m unittest discover -s tests -p 'test_e2e_harvest.py' -v
      - name: Run synthetic mission CLI
        run: python -m e2e_harvest.mission --input examples/harvest_mission.json --output /tmp/harvest-report.json
