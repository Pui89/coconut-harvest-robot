name: security
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for private-key material
        run: |
          if grep -R -n -E 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY' --exclude-dir=.git .; then exit 1; fi
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
